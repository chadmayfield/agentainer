# Agentainer tmux defaults.
# From https://code.claude.com/docs/en/terminal-config ("Configure tmux"):
# Pane programs cannot forward arbitrary sequences to the outer terminal.
set -g allow-passthrough off
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Truecolor passthrough; the image also sets CLAUDE_CODE_TMUX_TRUECOLOR=1, which Claude's
# docs say to set after this line (https://code.claude.com/docs/en/env-vars):
set -ga terminal-overrides ',*:Tc'
# Wheel scrolling for fullscreen TUIs (https://code.claude.com/docs/en/fullscreen):
set -g mouse on
set -g history-limit 50000
