# Agentainer colors: GitHub Dark (https://github.com/primer/primitives, @primer/primitives 11.10.0). Schema: https://github.com/eza-community/eza-themes
# LS_COLORS and EZA_COLORS override file-name styles, including these file kinds.
colourful: true
filekinds:
  normal: {foreground: "#e6edf3"}
  directory: {foreground: "#58a6ff", is_bold: true}
  symlink: {foreground: "#39c5cf"}
  pipe: {foreground: "#d2a8ff"}
  block_device: {foreground: "#d2a8ff", is_bold: true}
  char_device: {foreground: "#d2a8ff", is_bold: true}
  socket: {foreground: "#bc8cff", is_bold: false}
  special: {foreground: "#d2a8ff"}
  executable: {foreground: "#3fb950", is_bold: false}
  mount_point: {foreground: "#58a6ff", is_bold: true}
perms:
  user_read: {foreground: "#e6edf3"}
  user_write: {foreground: "#ffa657"}
  user_execute_file: {foreground: "#3fb950"}
  user_execute_other: {foreground: "#3fb950"}
  group_read: {foreground: "#e6edf3"}
  group_write: {foreground: "#ffa657"}
  group_execute: {foreground: "#3fb950"}
  other_read: {foreground: "#9198a1"}
  other_write: {foreground: "#ffa657"}
  other_execute: {foreground: "#3fb950"}
  special_user_file: {foreground: "#d2a8ff"}
  special_other: {foreground: "#d2a8ff"}
  attribute: {foreground: "#9198a1"}
size:
  major: {foreground: "#d2a8ff"}
  minor: {foreground: "#d2a8ff"}
  number_byte: {foreground: "#e6edf3"}
  number_kilo: {foreground: "#e6edf3"}
  number_mega: {foreground: "#79c0ff"}
  number_giga: {foreground: "#58a6ff"}
  number_huge: {foreground: "#ffa657"}
  unit_byte: {foreground: "#9198a1"}
  unit_kilo: {foreground: "#9198a1"}
  unit_mega: {foreground: "#9198a1"}
  unit_giga: {foreground: "#9198a1"}
  unit_huge: {foreground: "#9198a1"}
users:
  user_you: {foreground: "#58a6ff"}
  user_root: {foreground: "#ff7b72"}
  user_other: {foreground: "#e6edf3"}
  group_yours: {foreground: "#e6edf3"}
  group_other: {foreground: "#9198a1"}
  group_root: {foreground: "#ff7b72"}
links:
  normal: {foreground: "#9198a1"}
  multi_link_file: {foreground: "#39c5cf"}
git:
  new: {foreground: "#3fb950"}
  modified: {foreground: "#d29922"}
  deleted: {foreground: "#ff7b72"}
  renamed: {foreground: "#58a6ff"}
  typechange: {foreground: "#d2a8ff"}
  ignored: {foreground: "#9198a1"}
  conflicted: {foreground: "#ff7b72", is_bold: true}
git_repo:
  branch_main: {foreground: "#58a6ff"}
  branch_other: {foreground: "#58a6ff"}
  git_clean: {foreground: "#3fb950"}
  git_dirty: {foreground: "#d29922"}
file_type:
  image: {foreground: "#d2a8ff"}
  video: {foreground: "#d2a8ff"}
  music: {foreground: "#39c5cf"}
  lossless: {foreground: "#39c5cf"}
  crypto: {foreground: "#3fb950"}
  document: {foreground: "#e6edf3"}
  compressed: {foreground: "#ffa657"}
  temp: {foreground: "#9198a1"}
  compiled: {foreground: "#79c0ff"}
  build: {foreground: "#79c0ff"}
  source: {foreground: "#e6edf3"}
punctuation: {foreground: "#9198a1"}
date: {foreground: "#9198a1"}
inode: {foreground: "#9198a1"}
blocks: {foreground: "#9198a1"}
header: {foreground: "#58a6ff", is_bold: true, is_underline: false}
octal: {foreground: "#39c5cf"}
flags: {foreground: "#e6edf3"}
symlink_path: {foreground: "#39c5cf"}
control_char: {foreground: "#ff7b72"}
broken_symlink: {foreground: "#ff7b72"}
broken_path_overlay: {foreground: "#ff7b72"}
