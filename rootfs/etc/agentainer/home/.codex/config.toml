# Seeded once by Agentainer. Yours to edit.
cli_auth_credentials_store = "file"
# Codex's bubblewrap sandbox cannot start inside a container ("bwrap: Can't mount devpts
# on /newroot/dev/pts: Permission denied"), so every shell command would fail. The
# container is the isolation; Codex still asks before running commands.
# https://learn.chatgpt.com/docs/agent-approvals-security
sandbox_mode = "danger-full-access"

# https://learn.chatgpt.com/docs/config-file/config-reference
approval_policy = "on-request"
