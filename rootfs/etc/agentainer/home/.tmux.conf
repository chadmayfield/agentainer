# Agentainer colors, inspired by Ayu, with a pure black pane background.
# Palette: https://github.com/ayu-theme/ayu-colors/blob/master/themes/dark.yaml
# Options: https://github.com/tmux/tmux/blob/master/tmux.1
# The image supplies mouse, truecolor and agent terminal settings in /etc/tmux.conf.

set -g status-style 'bg=#202020,fg=#e6b450'
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 50
set -g status-interval 15
set -g status-left '#[bg=#202020,fg=#e6b450,bold] #S #[default] '
set -g status-right '#[fg=#e6b450,bold]#{?window_zoomed_flag, ZOOM ,}#[default]%a %d %b #[fg=#e6b450,bold]%H:%M '

set -g window-status-format ' #I:#W#F '
set -g window-status-style 'fg=#e6b450,bg=#202020'
set -g window-status-current-format ' #I:#W#F '
set -g window-status-current-style 'fg=#ffb454,bg=#333333,bold'
set -g window-status-activity-style 'fg=#e6b450,bg=#202020,bold'
set -g window-status-separator ' '

set -g window-style 'fg=#bfbdb6,bg=#000000'
set -g window-active-style 'fg=#bfbdb6,bg=#000000'
set -g pane-border-style 'fg=#5a6378'
set -g pane-active-border-style 'fg=#e6b450'
set -g display-panes-colour '#5a6378'
set -g display-panes-active-colour '#e6b450'
set -g message-style 'fg=#bfbdb6,bg=#0d1017'
set -g message-command-style 'fg=#e6b450,bg=#0d1017'
set -g mode-style 'fg=#000000,bg=#ffb454'
set -g clock-mode-colour '#e6b450'

# Window numbering and shortcuts.
# Commands: https://github.com/tmux/tmux/blob/master/tmux.1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
bind-key r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Copy mode, activity and pane resizing.
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# OSC 52 clipboard support: https://github.com/tmux/tmux/wiki/Clipboard
set -s set-clipboard external

set -g monitor-activity on
set -g visual-activity off
set -g bell-action none
set -g window-status-activity-style 'fg=#ffb454,bg=#202020,bold,underscore'

set -g repeat-time 750
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

bind-key c new-window -c '#{pane_current_path}'
