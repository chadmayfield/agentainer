name: bump
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-26.04
    # Runs take about 15 seconds; the resolver's HTTP requests time out after 60 seconds each.
    timeout-minutes: 15
    env:
      # A step "if" cannot read secrets (GitHub docs, use-secrets.md), so this carries
      # whether the App key is set.
      HAS_APP_KEY: ${{ secrets.BUMP_APP_PRIVATE_KEY != '' }}
    steps:
      # A pull request opened with GITHUB_TOKEN gets its CI runs "in an approval-required
      # state" (GitHub docs, actions-do-not-trigger-workflows). A push and pull request made
      # with a GitHub App installation token start CI without that approval. Without the App
      # variable and secret, the job falls back to GITHUB_TOKEN.
      - id: app
        if: vars.BUMP_APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
          # checkout stores this token in the git config, so the later git push uses it.
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Resolve pins
        shell: bash  # adds -o pipefail, so a failed resolver fails the job
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bump_versions.py | tee changes.txt
      - name: Open the PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RUN: ${{ github.run_number }}
        run: |
          if git diff --quiet; then echo "No version changes this week."; exit 0; fi
          b="bump/$(date -u +%Y-%m-%d)-$RUN"
          if [ -n "$APP_SLUG" ]; then
            # The App's bot user, as the create-github-app-token README sets it up.
            id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git switch -c "$b"
          git commit -am "chore: weekly version bump"
          git push origin "$b"
          { echo "Automated weekly pin update. Review and merge by hand."; echo; echo '```'; cat changes.txt; echo '```'; } > body.md
          gh pr create --base develop --head "$b" --title "Weekly version bump $(date -u +%Y-%m-%d)" --body-file body.md
          if [ -z "$APP_SLUG" ]; then
            echo "::notice::Opened with GITHUB_TOKEN: approve the CI run on the pull request with \"Approve workflows to run\"."
          fi
