name: build
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Python unit tests
        run: python3 -m unittest discover -s tests/unit -v
      - name: Launcher tests
        run: sh tests/host/test-launcher.sh

  image:
    name: image (${{ matrix.arch }})
    needs: lint-unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-26.04}
          - {arch: arm64, runner: ubuntu-26.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: localhost/agentainer:dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - name: Build
        run: RUNTIME=docker sh scripts/build.sh --tag "$IMAGE"
      - name: Build report (versions, changed pins, size)
        shell: bash  # -o pipefail: a failing command before | tee must fail the step
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          docker run --rm --entrypoint cat "$IMAGE" /etc/agentainer/versions.json >versions.json
          python3 scripts/build_report.py versions versions.json >>"$GITHUB_STEP_SUMMARY"
          # Compare with the commit before a push, or with the target branch of a PR or dispatch.
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            ref=$BEFORE
          else
            ref=${GITHUB_BASE_REF:-develop}
          fi
          if git fetch -q --depth=1 origin "$ref"; then
            git show FETCH_HEAD:versions.env >base-versions.env 2>/dev/null || : >base-versions.env
          else
            : >base-versions.env
          fi
          python3 scripts/build_report.py pins base-versions.env versions.env >>"$GITHUB_STEP_SUMMARY"
          docker history --human=false --no-trunc --format '{{.Size}}	{{.CreatedBy}}' "$IMAGE" |
            python3 scripts/build_report.py layers "$(docker image inspect "$IMAGE" --format '{{.Size}}')" >>"$GITHUB_STEP_SUMMARY"
      - name: Lint shell
        run: RUNTIME=docker sh tests/lint.sh
      - name: Container tests with Docker
        shell: bash  # -o pipefail: a failing command before | tee must fail the step
        run: |
          rc=0
          RUNTIME=docker sh tests/run.sh 2>&1 | tee tests-docker.log || rc=$?
          python3 scripts/build_report.py tests Docker tests-docker.log >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Manifest tests
        run: RUNTIME=docker sh tests/host/test-manifests.sh
      - name: Linux host checks with Docker (spec tests 10a and 11)
        run: |
          set -eu
          # sudo blocked by no-new-privileges=true, allowed without it
          if docker run --rm --security-opt no-new-privileges=true "$IMAGE" sudo -n true; then
            echo "FAIL: sudo worked with no-new-privileges"; exit 1; fi
          docker run --rm "$IMAGE" sudo -n true
          # rootful Docker writes as UID 1000 (documented limitation, spec 12.4)
          mkdir -p ws && sudo chmod 777 ws && docker run --rm -v "$PWD/ws:/workspace" "$IMAGE" touch /workspace/d
          echo "docker-created file owner: $(stat -c %u ws/d) (runner uid $(id -u))" | tee -a "$GITHUB_STEP_SUMMARY"
          # SSH agent forwarding on a Linux host (open item 7). ssh-agent refuses a peer
          # with a different UID (openssh-portable ssh-agent.c, "uid mismatch"), so the
          # client runs as the runner's UID, as it does for a host user with UID 1000.
          eval "$(ssh-agent -s)" && ssh-keygen -q -t ed25519 -N '' -f k && ssh-add k
          chmod 755 "$(dirname "$SSH_AUTH_SOCK")"
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint ssh-add \
            -v "$SSH_AUTH_SOCK:/run/ssh-agent.sock" -e SSH_AUTH_SOCK=/run/ssh-agent.sock "$IMAGE" -l | grep -q ED25519
      - name: Agents on a CPU without AVX2
        if: matrix.arch == 'amd64'
        shell: bash  # -o pipefail: a failing agent must fail the step through tee
        run: |
          set -eu
          # qemu-user's qemu-x86_64 is statically linked, so it runs inside the image.
          # SandyBridge has AVX but not AVX2; Haswell adds AVX2.
          sudo apt-get install -y -qq qemu-user >/dev/null
          docker run --rm -v /usr/bin/qemu-x86_64:/usr/local/bin/qemu-x86_64:ro --entrypoint bash "$IMAGE" -c '
            set -u
            cd /tmp
            printf "%s\n" "#include <immintrin.h>" \
              "int main(void) { volatile __m256i a = _mm256_set1_epi32(1);" \
              "  __m256i b = _mm256_add_epi32(a, a); return _mm256_extract_epi32(b, 0) == 2 ? 0 : 1; }" >avx2.c
            gcc -O0 -mavx2 -o avx2 avx2.c
            # Control: the AVX2 program must fail on SandyBridge and run on Haswell,
            # or this check proves nothing.
            if qemu-x86_64 -cpu SandyBridge ./avx2 2>/dev/null; then echo "control: AVX2 ran on SandyBridge" >&2; exit 1; fi
            qemu-x86_64 -cpu Haswell ./avx2 || { echo "control: AVX2 failed on Haswell" >&2; exit 1; }
            failed=0
            echo "| Agent | --version on SandyBridge (no AVX2) |"
            echo "|---|---|"
            for c in claude codex agy opencode; do
              bin=$(readlink -f "$(command -v "$c")")
              if out=$(qemu-x86_64 -cpu SandyBridge "$bin" --version 2>&1 </dev/null); then r="runs: $(printf "%s" "$out" | head -1)"
              else r="fails (exit $?): $(printf "%s" "$out" | tail -1)"; failed=1; fi
              echo "| $c | $r |"
            done
            # The README says every agent starts without AVX2; a bump that breaks it fails here.
            exit "$failed"' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Secret scan (blocks) and vulnerability scan (report only)
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker builder prune -af
          docker save -o image.tar "$IMAGE"
          # docker save writes mode 0600; the scan runs as the image user (UID 1000).
          chmod 644 image.tar
          df -h /
          mounts=(-v "$PWD/image.tar:/scan/image.tar:ro")
          extra=()
          if [ -f trivy-secret.yaml ]; then
            mounts+=(-v "$PWD/trivy-secret.yaml:/scan/trivy-secret.yaml:ro")
            extra=(--secret-config /scan/trivy-secret.yaml)
          fi
          docker run --rm "${mounts[@]}" --entrypoint trivy "$IMAGE" \
            image --input /scan/image.tar --scanners secret --exit-code 1 "${extra[@]}"
          # The full report is an artifact: the job summary is limited to 1 MiB.
          mkdir -p report && chmod 777 report
          docker run --rm "${mounts[@]}" -v "$PWD/report:/report" --entrypoint trivy "$IMAGE" \
            image --input /scan/image.tar --scanners vuln --exit-code 0 --format json --output /report/vulnerabilities.json
          python3 scripts/vuln_summary.py "$ARCH=report/vulnerabilities.json" >>"$GITHUB_STEP_SUMMARY"
          echo "Full report: the vulnerabilities-$ARCH artifact." >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vulnerabilities-${{ matrix.arch }}
          path: report/vulnerabilities.json
          if-no-files-found: ignore
      - name: Move the image from Docker to Podman
        run: |
          docker rmi "$IMAGE"
          podman load -i image.tar && rm image.tar
          df -h /
      - name: Linux host checks with rootless Podman
        run: |
          set -eu
          podman run --rm --userns=keep-id:uid=1000,gid=1000 --security-opt no-new-privileges "$IMAGE" sh -c '! sudo -n true'
          # bind-mount ownership: rootless Podman keeps the runner user's UID
          mkdir -p wsp && podman run --rm --userns=keep-id:uid=1000,gid=1000 -v "$PWD/wsp:/workspace" "$IMAGE" touch /workspace/p
          test "$(stat -c %u wsp/p)" = "$(id -u)"
      - name: Container tests with Podman
        shell: bash  # -o pipefail: a failing command before | tee must fail the step
        run: |
          rc=0
          RUNTIME=podman sh tests/run.sh 2>&1 | tee tests-podman.log || rc=$?
          python3 scripts/build_report.py tests Podman tests-podman.log >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0}
      - id: ver
        name: Version from the merged release branch (spec 16.4)
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          # A release PR merged with "Create a merge commit" has the subject
          # "Merge pull request #N from <owner>/release/<version>".
          subject=$(git log -1 --format=%s "$SHA")
          # Releases are calendar versions YYYY.MM.DD, with .N for a second one that day.
          v=$(printf '%s\n' "$subject" | sed -nE 's|.*release/([0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?)$|\1|p')
          if [ -z "$v" ]; then
            echo "::error::Push to main is not a release merge (\"$subject\"). Merge release PRs with a merge commit." >&2
            exit 1
          fi
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "Tag v$v already exists" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-26.04}
          - {arch: arm64, runner: ubuntu-26.04-arm}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: pins
        name: Build arguments, as scripts/build.sh passes them
        run: |
          {
            echo "base=$(sed -n 's/^BASE_IMAGE=//p' versions.env)"
            echo "snapshot=$(sed -n 's/^APT_SNAPSHOT=//p' versions.env)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "buildkit=$(sed -n 's/^BUILDKIT_IMAGE=//p' versions.env)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: image=${{ steps.pins.outputs.buildkit }}  # pinned in versions.env
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ steps.pins.outputs.base }}
            APT_SNAPSHOT=${{ steps.pins.outputs.snapshot }}
            IMAGE_VERSION=${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.pins.outputs.date }}
          sbom: true
          provenance: true
          # zstd: 946 MB to download against 1,191 MB with gzip, measured on this image. BuildKit
          # maps levels 9 to 22 to its "Best" setting (about zstd 11; Docker build exporters docs).
          outputs: type=image,name=ghcr.io/chadmayfield/agentainer,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=9,force-compression=true
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
      - name: Scan the pushed image for vulnerabilities
        env:
          ARCH: ${{ matrix.arch }}
          REF: ghcr.io/chadmayfield/agentainer@${{ steps.build.outputs.digest }}
        run: |
          set -eu
          docker pull "$REF"
          docker save -o image.tar "$REF"
          chmod 644 image.tar  # docker save writes 0600; trivy runs as UID 1000
          mkdir -p report && chmod 777 report
          docker run --rm -v "$PWD/image.tar:/scan/image.tar:ro" -v "$PWD/report:/report" --entrypoint trivy "$REF" \
            image --input /scan/image.tar --scanners vuln --exit-code 0 --format json \
            --output "/report/vulnerabilities-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-vulnerabilities-${{ matrix.arch }}
          path: report/vulnerabilities-${{ matrix.arch }}.json

  release:
    needs: [version, publish]
    runs-on: ubuntu-26.04
    concurrency: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: {pattern: digest-*, merge-multiple: true, path: digests}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: {pattern: release-vulnerabilities-*, merge-multiple: true, path: report}
      - id: pins
        run: echo "buildkit=$(sed -n 's/^BUILDKIT_IMAGE=//p' versions.env)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: image=${{ steps.pins.outputs.buildkit }}  # pinned in versions.env
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Merge manifest, tag and sign
        shell: bash
        env:
          V: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          img=ghcr.io/chadmayfield/agentainer
          refs=()
          for d in digests/*; do refs+=("$img@sha256:$(basename "$d")"); done
          docker buildx imagetools create -t "$img:latest" -t "$img:$V" -t "$img:sha-${SHA::7}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$img:$V" --format '{{json .Manifest}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["digest"])')
          cosign sign --yes "$img@$digest"
      - name: Git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The summary goes above the generated notes ("--notes" is prepended, gh release create --help).
          notes=$(python3 scripts/vuln_summary.py amd64=report/vulnerabilities-amd64.json arm64=report/vulnerabilities-arm64.json)
          notes="$notes

          Full trivy reports for each architecture are attached as vulnerabilities-<arch>.json."
          gh release create "v$V" --target "$SHA" --title "v$V" --generate-notes --notes "$notes" \
            report/vulnerabilities-amd64.json report/vulnerabilities-arm64.json
