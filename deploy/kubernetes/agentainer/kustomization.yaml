apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service.yaml
  - statefulset.yaml
  # - networkpolicy.yaml
# Set newTag to a published SemVer release, or replace it with digest: sha256:...
# "latest" follows only the highest stable release and is absent before the first one.
images:
  - name: ghcr.io/chadmayfield/agentainer
    newTag: latest
