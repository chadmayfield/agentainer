apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service.yaml
  - transfer-pvc.yaml
  - filebrowser-config.yaml
  - statefulset.yaml
  # Optional policies. Both need a CNI plugin that enforces NetworkPolicy.
  # - networkpolicy.yaml
  # - ingress-policy.yaml
# newTag repeats AGENTAINER_RELEASE_VERSION in versions.env, a published release that the
# scheduled update moves to each new release. To stay on one release, set your own tag, or
# replace newTag with digest: sha256:... The "latest" tag follows only the highest stable
# release and does not exist before the first one.
images:
  - name: ghcr.io/chadmayfield/agentainer
    newTag: 0.1.0-dev.20261104.1
