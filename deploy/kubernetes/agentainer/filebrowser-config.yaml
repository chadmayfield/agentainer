# FileBrowser Quantum settings, read from FILEBROWSER_CONFIG at startup. Edits take effect
# after the pod restarts. Key names are the json tags of the Settings structs in
# gtsteffaniak/filebrowser v2.0.2-stable, backend/pkg/settings/structs.go and auth.go;
# the loader rejects unknown keys (yaml.DisallowUnknownField in config.go).
# Docs: https://filebrowserquantum.com/en/docs/configuration/http/,
# https://filebrowserquantum.com/en/docs/configuration/server/ and
# https://filebrowserquantum.com/en/docs/configuration/authentication/password/
#
# No admin password is set. On first start Quantum generates one, logs it once and
# requires a change at first login (bootstrapDefaultAdminPassword in
# backend/internal/state/bootstrap_admin_password.go). Read it with
#   kubectl -n agentainer logs agentainer-0 -c filebrowser | grep 'initial admin password'
# The database on the transfer volume keeps accounts across restarts.
#
# Analytics is a database setting that is off by default. No config key controls it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentainer-filebrowser
  namespace: agentainer
data:
  config.yaml: |
    http:
      # 8080 because binding below 1024 needs NET_BIND_SERVICE, which the pod drops.
      port: 8080
      # Loopback only. kubectl port-forward connects inside the pod's network namespace,
      # so it still reaches this address; other pods cannot.
      listen: 127.0.0.1
      disableWebDAV: true
    server:
      # The default "tmp" is relative to the image's working directory. This keeps the
      # cache on the transfer volume, next to the database.
      cacheDir: /home/filebrowser/data/cache
      sources:
        - path: /srv/transfer
    auth:
      methods:
        password:
          enabled: true
        # Single sign-on through a trusted reverse proxy uses proxy login instead
        # (https://filebrowserquantum.com/en/docs/configuration/authentication/proxy/).
        # The proxy must set the header and strip it from client requests, because
        # Quantum accepts the header value as the username. Proxy login needs a
        # non-loopback listen address (for example 0.0.0.0) and its own Service that
        # only the proxy can reach, for example through an ingress NetworkPolicy.
        #   proxy:
        #     enabled: true
        #     header: X-Forwarded-User
