# Optional. Add it to kustomization.yaml to deny all ingress to the agentainer pod. It needs
# a CNI plugin that enforces NetworkPolicy. SSH sessions still work, because ContainerSSH
# reaches the pod through the Kubernetes API (pods/exec), not the pod network. kubectl
# port-forward to FileBrowser Quantum also goes through the API server and the kubelet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentainer-ingress
  namespace: agentainer
spec:
  podSelector: {matchLabels: {app: agentainer}}
  policyTypes: [Ingress]
