apiVersion: apps/v1
kind: Deployment
metadata: {name: agentainer-auth, namespace: containerssh}
spec:
  replicas: 1
  selector: {matchLabels: {app: agentainer-auth}}
  template:
    metadata: {labels: {app: agentainer-auth}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webhook
          image: docker.io/library/python:3.14-slim@sha256:930e1abba7c4e8f96ed93e8012c35d174d7732752731bbd5e8e757d7ec6f3966
          command: [python3, /app/webhook.py]
          env:
            - {name: AGENTAINER_USER, value: dev}  # the SSH username you will log in with
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:  # example values
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: keys, mountPath: /etc/agentainer-auth, readOnly: true}
            # A whole-directory mount, so ConfigMap edits reach the running pod.
            # A subPath mount would never be updated.
            - {name: features, mountPath: /etc/agentainer-features, readOnly: true}
      volumes:
        - name: app
          configMap: {name: agentainer-auth-webhook}
        - name: keys
          secret: {secretName: agentainer-authorized-keys}
        - name: features
          # optional: without the ConfigMap the webhook keeps SFTP and forwarding closed.
          configMap: {name: agentainer-features, optional: true}
